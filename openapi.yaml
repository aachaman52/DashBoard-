openapi: 3.1.0
info:
  title: Aachman Studios Control Center Local API
  version: 0.1.0
  description: Early local-only API. Every route requires a bearer token.
servers:
  - url: http://127.0.0.1:3000
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
paths:
  /api/summary:
    get:
      operationId: getSummary
      summary: Get available activity totals and explicit nulls for unconnected providers
      responses:
        '200': {description: Summary JSON}
        '401': {description: Unauthorized}
  /api/projects:
    get:
      operationId: getProjects
      summary: Discover GitHub repositories
      responses:
        '200': {description: Repositories from GitHub}
  /api/projects/{repo}/activity:
    get:
      operationId: getProjectActivity
      summary: Get commits, issues and releases
      parameters:
        - name: repo
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: GitHub activity}
  /api/activity:
    get:
      operationId: getActivity
      summary: Get local activity and aggregated minutes
      responses:
        '200': {description: Sessions and totals}
    post:
      operationId: addActivity
      summary: Upload one opt-in desktop session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app, start, end]
              properties:
                app: {type: string}
                start: {type: string, format: date-time}
                end: {type: string, format: date-time}
                category: {type: string}
                project: {type: string}
      responses:
        '201': {description: Session saved}
  /api/export/activity.csv:
    get:
      operationId: exportActivity
      summary: Download Excel-compatible activity CSV
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: {type: string}
